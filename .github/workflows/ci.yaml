name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group:
    ${{ github.event_name != 'merge_group' && format('{0}-{1}', github.workflow, github.head_ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  #v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  #v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Pre-pull network images
        run: docker compose -f standalone.yml pull

      - name: Run end-to-end smoke test
        # Drives the interactive CLI through:
        #   1) fund accounts from the example config (NIGHT transfer + DUST registration)
        #   4) exit
        # Verifies the whole pipeline: network startup, master wallet init,
        # DUST registration, NIGHT transfer, recipient DUST registration.
        run: printf '1\n./accounts.example.json\n4\n' | npm start

      - name: Stop local Midnight network
        if: always()
        run: |
          docker compose -f standalone.yml down --remove-orphans || true
          docker rm -f midnight-node midnight-indexer midnight-proof-server 2>/dev/null || true

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  #v7.0.1
        with:
          name: midnight-local-dev-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
